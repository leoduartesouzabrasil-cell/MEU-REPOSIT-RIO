function imprimir(im, s = 0.32, maxW = 2000, lo = 0.8, hi = 99.4) {

const fonte = (f, px, peso = 400, est = '') => { ctx.font = `${est} ${peso} ${px}px ${f}`; };
function txt(s, x, y, o = {}) {
  const { f = F.bloco, px = 80, peso = 400, cor = TINTA, al = 'left', track = 0, est = '', base = 'alphabetic', a = 1 } = o;
  fonte(f, px, peso, est); ctx.fillStyle = cor; ctx.textBaseline = base; ctx.globalAlpha *= a;

}
const larg = (s, f, px, peso = 400, track = 0) => { fonte(f, px, peso); ctx.letterSpacing = track + 'px'; const w = ctx.measureText(s).width; ctx.letterSpacing = '0px'; return w; };
function fundo(c) { ctx.fillStyle = c; ctx.fillRect(-200, -200, W + 400, H + 400); }
function cover(img, x, y, w, h, fx = 0.5, fy = 0.5, zoom = 1) {   // cobre o retângulo, centrado no ponto de foco
  const k = Math.max(w / img.width, h / img.height) * zoom, sw = w / k, sh = h / k;
  const sx = clamp(fx * img.width - sw / 2, 0, img.width - sw), sy = clamp(fy * img.height - sh / 2, 0, img.height - sh);
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function janela(x, y, w, h, ang, desenho, o = {}) {           // janela (retângulo girado) com borda de tinta e foto dentro
  const { borda = 8, corBorda = TINTA, skew = 0, sombra = true } = o;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(ang); ctx.transform(1, 0, skew, 1, 0, 0);
  if (sombra) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18; ctx.fillStyle = corBorda; ctx.fillRect(-w / 2 - borda, -h / 2 - borda, w + 2 * borda, h + 2 * borda); ctx.restore(); }

  ctx.restore();
}
function bloco(s, x, y, o = {}) {                              // bloco de texto (palavra-bloco num retângulo cheio)
  const { f = F.bloco, px = 90, cor = BEGE, fundoC = VERM, pad = 26, ang = 0, al = 'left', peso = 400, track = 0, esc = 1, a = 1 } = o;
  const w = larg(s, f, px, peso, track), h = px * 1.12;

// carimbo: entra grande e transparente, bate (escala 1.5→1 com retorno), tremor curto; borda gasta
function carimbo(p, x, y, ang, desenho) {
  if (p <= 0) return; const e = back(clamp(p * 1.25), 2.4), s = lerp(1.7, 1, e), a = clamp(p * 4);
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s); desenho(); ctx.restore();

// faixa ao longo do eixo (passa pelo ponto x,y); texto no centro da faixa
function faixa(x, y, esp, cor, ang = EIXO, comp = 3000) { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = cor; ctx.fillRect(-comp / 2, -esp / 2, comp, esp); ctx.restore(); }
function raios(cx, cy, n, rot, cor, r = 2600) {

  for (let i = 0; i < n; i++) { const a0 = (i / n) * Math.PI * 2, a1 = a0 + Math.PI / n; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a0) * r, Math.sin(a0) * r); ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
// rachadura: polilinha serrilhada semeada de A a B, com ramos; p = quanto já rachou
function rachadura(seed, ax, ay, bx, by, p, o = {}) {

    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);

// corrente: elos ao longo de um ângulo; quebra = índice do elo partido (abre um buraco)
function corrente(x, y, ang, n, elo, desloc, o = {}) {

  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  for (let i = 0; i < n; i++) {

// patrão: recorte de cartaz (cartola, charuto, barriga) com borda de papel; pose 0 = de pé, 1 = empurrando (inclinado), braço = ângulo
function patrao(x, y, h, o = {}) {
  const { incl = 0, braco = 0.2, cor = TINTA, borda = BEGE, brasa = VERM } = o, k = h / 1000;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.rotate(incl);

    ctx.moveTo(85, -650); ctx.arc(0, -650, 85, 0, Math.PI * 2);                           // cabeça
    ctx.moveTo(-210, -520); ctx.quadraticCurveTo(-260, -200, -170, 0); ctx.lineTo(170, 0); ctx.quadraticCurveTo(300, -260, 210, -520); ctx.quadraticCurveTo(0, -590, -210, -520); // tronco + barriga

  };

  ctx.fillStyle = cor; ctx.save(); ctx.translate(70, -610); ctx.rotate(-0.2); ctx.fillRect(0, -9, 120, 18); ctx.fillStyle = brasa; ctx.fillRect(116, -9, 18, 18); ctx.restore(); // charuto

// operário (pictograma) com ferramenta; fase = passo
function operario(x, y, h, fase, cor = BEGE) {

// ---------------------------------------------------------------- legenda (padrão da casa)
const CHAVE = /^(escravid|garantid|brecha|folga|semana|mês|lutou|empurrar|patrão|derrubar|plenário|compartilhe|sindicato|quiser|stf|dezembro|6x1)/i;

// ---------------------------------------------------------------- transições no meio (faixa vermelha a 72°, íris)
function wipe(t, t0, A, B, dur = 0.28) {

}
