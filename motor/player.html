<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Construtivismo Tropical — player</title>
<style>
  @font-face { font-family: "Big Shoulders Display"; src: url("../identidade/fontes/BigShouldersDisplay[wght].ttf"); font-weight: 100 900; }
  @font-face { font-family: "Russo One"; src: url("../identidade/fontes/RussoOne-Regular.ttf"); }
  @font-face { font-family: "Oswald"; src: url("../identidade/fontes/Oswald[wght].ttf"); font-weight: 200 700; }
  @font-face { font-family: "Special Elite"; src: url("../identidade/fontes/SpecialElite-Regular.ttf"); }
  @font-face { font-family: "Instrument Serif"; src: url("../identidade/fontes/InstrumentSerif-Regular.ttf"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../identidade/fontes/InstrumentSerif-Italic.ttf"); }
  @font-face { font-family: "Archivo"; src: url("../identidade/fontes/Archivo[wdth,wght].ttf"); font-weight: 100 900; }
  html, body { margin: 0; background: #1C1714; }
  canvas { display: block; max-height: 100vh; max-width: 100vw; margin: auto; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<script src="lib.js"></script>
<script src="mapa-br.js"></script>
<script>
  // ?cena=nome carrega motor/cenas/nome.js ; ?t=3.2 congela num instante
  const q = new URLSearchParams(location.search);
  // cenas/<nome>.tempos.js (opcional, gerado pelo script de áudio) carrega antes da cena
  const nome = q.get('cena') || 'demo', s = document.createElement('script');
  const tempos = document.createElement('script');
  tempos.src = `cenas/${q.get('tempos') || nome}.tempos.js`;   // ?tempos= troca a versão (ex.: corte de 60 s)
  tempos.onload = tempos.onerror = () => { s.src = `cenas/${nome}.js`; document.body.appendChild(s); };
  document.body.appendChild(tempos);

  window.pronto = new Promise(ok => {
    s.onload = async () => {
      const cena = window.CENA, tela = document.getElementById('tela');
      tela.width = cena.w; tela.height = cena.h;
      const ctx = tela.getContext('2d');
      await Promise.all(['900 10px "Big Shoulders Display"', '10px "Russo One"', '600 10px "Oswald"', '10px "Special Elite"',
        'italic 400 10px "Instrument Serif"', '400 10px "Instrument Serif"', '700 10px "Archivo"']
        .map(f => document.fonts.load(f)));
      // imagens da cena: CENA.imagens = { nome: 'caminho relativo a motor/' } → L.img.nome
      await Promise.all(Object.entries(cena.imagens || {}).map(([nome, src]) => new Promise((ok2, erro) => {
        const im = new Image(); im.onload = () => { CT.img[nome] = im; ok2(); };
        im.onerror = () => erro(new Error('imagem não carregou: ' + src)); im.src = src;
      })));
      window.renderAt = t => { cena.desenhar(ctx, t, CT); };
      window.frameData = (t, tipo = 'image/png', q = 0.92) => { renderAt(t); return tela.toDataURL(tipo, q); };
      if (q.has('t')) renderAt(parseFloat(q.get('t')));
      else if (!navigator.webdriver) {   // pré-visualização ao vivo no navegador
        const t0 = performance.now();
        const loop = () => { renderAt(((performance.now() - t0) / 1000) % cena.dur); requestAnimationFrame(loop); };
        loop();
      }
      ok(cena);
    };
  });
</script>
</body>
</html>
